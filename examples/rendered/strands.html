<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strands forced structured-output: any vs by-name</title><style>

body{margin:0;background:var(--canvas);color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:24px;font-family:JetBrains Mono,ui-monospace,Menlo,monospace}

button:hover{border-color:var(--cyan)}
.hint{color:var(--dim);font-size:11px;margin-top:10px}
</style></head><body><main>

<svg id="diagram" viewBox="0 0 930 754" width="100%" font-family="JetBrains Mono,ui-monospace,Menlo,Consolas,monospace" role="img"><rect width="930" height="754" fill="var(--canvas)"/><text x="40" y="36" fill="var(--ink)" font-size="17" font-weight="700">Strands forced structured-output: any vs by-name</text><text x="40" y="58" fill="var(--muted)" font-size="11">agent-loop-trace · 8 events · showcase pass 5/5</text><line x1="145" y1="90" x2="145" y2="654" stroke="var(--border)"/><rect x="75" y="44" width="140" height="38" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="145" y="67" fill="var(--ink)" font-size="12" font-weight="600" text-anchor="middle">Event Loop</text><line x1="315" y1="90" x2="315" y2="654" stroke="var(--border)"/><rect x="245" y="44" width="140" height="38" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="315" y="67" fill="var(--ink)" font-size="12" font-weight="600" text-anchor="middle">Model</text><line x1="485" y1="90" x2="485" y2="654" stroke="var(--border)"/><rect x="415" y="44" width="140" height="38" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="485" y="67" fill="var(--ink)" font-size="12" font-weight="600" text-anchor="middle">Provider fmt</text><line x1="655" y1="90" x2="655" y2="654" stroke="var(--border)"/><rect x="585" y="44" width="140" height="38" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="655" y="67" fill="var(--ink)" font-size="12" font-weight="600" text-anchor="middle">ProductModel</text><line x1="825" y1="90" x2="825" y2="654" stroke="var(--border)"/><rect x="755" y="44" width="140" height="38" rx="8" fill="var(--panel)" stroke="var(--border)"/><text x="825" y="67" fill="var(--ink)" font-size="12" font-weight="600" text-anchor="middle">Built-in</text><line x1="145" y1="120" x2="315" y2="120" stroke="var(--cyan)" stroke-width="2"/><polygon points="315,120 307,116 307,124" fill="var(--cyan)"/><text x="230" y="112" fill="var(--cyan)" font-size="10.5" font-weight="700" text-anchor="middle">s1 cycle1: specs=[ProductModel]</text><text x="20" y="124" fill="var(--dim)" font-size="10">1</text><line x1="315" y1="188" x2="145" y2="188" stroke="var(--muted)" stroke-width="2"/><polygon points="145,188 153,184 153,192" fill="var(--muted)"/><text x="230" y="180" fill="var(--muted)" font-size="10.5" font-weight="700" text-anchor="middle">s2 plain text (no tool call)</text><text x="20" y="192" fill="var(--dim)" font-size="10">2</text><line x1="145" y1="256" x2="315" y2="256" stroke="var(--amber)" stroke-width="2"/><polygon points="315,256 307,252 307,260" fill="var(--amber)"/><text x="230" y="248" fill="var(--amber)" font-size="10.5" font-weight="700" text-anchor="middle">s3 forced retry: tool_choice=any</text><text x="230" y="274" fill="var(--muted)" font-size="10" text-anchor="middle">BUG: any only forces when sole tool on wire</text><text x="20" y="260" fill="var(--dim)" font-size="10">3</text><line x1="145" y1="324" x2="485" y2="324" stroke="var(--cyan)" stroke-width="2"/><polygon points="485,324 477,320 477,328" fill="var(--cyan)"/><text x="315" y="316" fill="var(--cyan)" font-size="10.5" font-weight="700" text-anchor="middle">s4 narrow specs to [ProductModel]</text><text x="20" y="328" fill="var(--dim)" font-size="10">4</text><line x1="485" y1="392" x2="315" y2="392" stroke="var(--rose)" stroke-width="2"/><polygon points="315,392 323,388 323,396" fill="var(--rose)"/><text x="400" y="384" fill="var(--rose)" font-size="10.5" font-weight="700" text-anchor="middle">s5 wire: +built-ins, choice=any</text><text x="400" y="410" fill="var(--muted)" font-size="10" text-anchor="middle">Gemini/OpenAI/Anthropic append after narrowing</text><text x="20" y="396" fill="var(--dim)" font-size="10">5</text><line x1="315" y1="460" x2="825" y2="460" stroke="var(--rose)" stroke-width="2"/><polygon points="825,460 817,456 817,464" fill="var(--rose)"/><text x="570" y="452" fill="var(--rose)" font-size="10.5" font-weight="700" text-anchor="middle">s6 picks built-in, skips </main><script>
document.addEventListener('keydown',e=>{if(e.key==='t'||e.key==='T')document.querySelector('.toolbar button').click();if(e.key==='e'||e.key==='E')exportPNG();});
function copyShare(){navigator.clipboard&&navigator.clipboard.writeText("Strands forced structured-output: any vs by-name — agent-loop-trace (8 events, validated showcase)").then(()=>alert('Share text copied')).catch(()=>prompt('Copy:',"Strands forced structured-output: any vs by-name — agent-loop-trace (8 events, validated showcase)"));}
function exportPNG(){const svg=document.getElementById('diagram');const xml=new XMLSerializer().serializeToString(svg);const css=getComputedStyle(document.documentElement);const filled=xml.replace(/var\(--canvas\)/g,css.getPropertyValue('--canvas')).replace(/var\(--panel\)/g,css.getPropertyValue('--panel')).replace(/var\(--ink\)/g,css.getPropertyValue('--ink')).replace(/var\(--border\)/g,css.getPropertyValue('--border')).replace(/var\(--muted\)/g,css.getPropertyValue('--muted')).replace(/var\(--dim\)/g,css.getPropertyValue('--dim')).replace(/var\(--cyan\)/g,'#22D3EE').replace(/var\(--green\)/g,'#34D399').replace(/var\(--amber\)/g,'#FBBF24').replace(/var\(--rose\)/g,'#FB7185');const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=930*2;c.height=754*2;const ctx=c.getContext('2d');ctx.scale(2,2);const bg=document.documentElement.dataset.theme==='light'?'#ffffff':'#020617';ctx.fillStyle=bg;ctx.fillRect(0,0,930,754);ctx.drawImage(img,0,0,930,754);const a=document.createElement('a');a.download='loop-trace.png';a.href=c.toDataURL('image/png');a.click();};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(filled);}
</script></body></html>
